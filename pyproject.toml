[build-system]
requires = ["setuptools>=42", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nemo_rl"]

[tool.setuptools.dynamic]
version = { attr = "nemo_rl.__version__" }                      # any module attribute compatible with ast.literal_eval
readme = { file = "README.md", content-type = "text/markdown" }

[project]
name = "nemo-rl"
dynamic = ["version", "readme"]
description = "NeMo RL: A Scalable and Efficient Post-Training Library for Models Ranging from 1 GPU to 1000s, and from Tiny to >100B Parameters"
requires-python = ">=3.13.7" # bare-metal: relaxed from >=3.13.13 (undocumented routine bump, not
# tied to any known fix) since that exact patch isn't downloadable via uv's interpreter catalog;
# cp313 wheels (incl. wheelyard's) are ABI-stable across 3.13.x patches.
license = { text = "Apache 2.0" }
dependencies = [
  "setuptools",
  "pip",                                                                                                              # Required for frozen environments; uv venv --seed may not reliably install pip
  "ninja",                                                                                                            # for flash-attn parallel build
  "torch==2.13.0.dev20260513+cu126",                                                                                  # bare-metal: pinned to match our own wheelyard build (see [tool.uv.sources])
  "triton; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "colored==2.2.3",
  "ray[default]==2.54.0",
  "wandb>=0.25.1",
  "numpy",
  "datasets>=4.0.0",
  "rich",
  "math-verify",
  "accelerate>=0.26",
  "tensorboard",
  "omegaconf",
  "torchdata",
  "nvidia-ml-py",
  "hydra-core",
  "tiktoken",
  "blobfile",
  "debugpy",
  "nvtx",
  "matplotlib",
  "plotly",
  "sympy>=1.14.0",
  "pillow>=12.1.1",
  "torchvision==0.27.0.dev20260513+cu126.pinfix",                                                                    # bare-metal: pinned to match our own wheelyard build
  # bare-metal: only ever pulled in transitively (via transformers' AutoProcessor
  # import chain, unused here) until now — [tool.uv.sources] doesn't apply to
  # transitive deps, so making it explicit here is what actually routes it to the
  # pytorch-cpu index below instead of a stray CUDA-13-linked PyPI build.
  "torchaudio",
  # bare-metal: was 5.3.0; vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set)
  # needs >=5.5.3. Tried an exact pin (==5.16.0, the version this floor was
  # tested against) but uv's extras-fork resolver silently re-resolved the
  # vllm/automodel split to a newer PyPI release (5.16.1) satisfying the floor
  # anyway, ignoring the exact pin — confirmed via `uv tree --package
  # transformers --invert` and by trying the pin as an override-dependencies
  # entry instead (that dropped transformers from the lock entirely, worse).
  # Not worth fighting uv's resolver over a patch version; floor-only avoids
  # pretending this is exact when it isn't.
  # `; extra != 'sglang'`: sglang==0.5.10 itself hard-pins transformers==5.3.0
  # (a real constraint we don't control) — straight conflict with our floor.
  # sglang is never actually used bare-metal, so scoping it away here (one
  # declaration, not overlapping ones) sidesteps the conflict without
  # reintroducing the earlier silent-drop-from-automodel problem this used to hit.
  "transformers>=5.5.3; extra != 'sglang'",
  "num2words>=0.5.14",                                                                                                # for SmolVLM
  "mlflow>=3.11.1",
  "nvidia-nvshmem-cu12; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')", # for deep_ep build
  "swanlab",
  "pyzmq",
  "decord2",
  "nccl4py",                                                                                                          # for non-colocated refit
  "cuda-bindings",                                                                                                    # for non-colocated refit
  "pybase64",                                                                                                         # for sglang refit
  "nvidia-cudnn-cu12==9.19.0.56",                                                                                     # for transformer-engine no build isolation
]

[project.optional-dependencies]
# mamba-ssm/causal-conv1d dropped (bare-metal): SSM/Mamba-architecture support we
# don't use, and their git builds fail to compile against our CUDA 12.6/gcc pairing
# (nvcc errors like "namespace std has no member string_view", missing -std=c++17).
# Re-add if that gets fixed or Mamba-style models are ever needed.
fsdp = ["flash-attn==2.8.3"]
automodel = [
  # bare-metal: dropped [moe] (pulls in nemo_automodel[cuda], which is where
  # mamba-ssm/causal-conv1d actually come from, plus its own
  # transformer-engine[pytorch]<=2.11.0 pin conflicting with our wheelyard
  # override below). DomynEdge is dense, not MoE.
  "nemo-automodel",
  # Flash-attn version should be selected to satisfy both TE + vLLM requirements (xformers in particular)
  # https://github.com/NVIDIA/TransformerEngine/blob/v2.3/transformer_engine/pytorch/attention/dot_product_attention/utils.py#L108
  # https://github.com/facebookresearch/xformers/blob/8354497deb2c04c67fbb2e2ad911e86530da0e90/xformers/ops/fmha/flash.py#L76
  "flash-attn==2.8.3",
  # bare-metal: dropped this extra's own transformers>=5.3.0 floor — it and the
  # unconditional transformers>=5.5.3 floor above are an overlapping-declaration
  # pattern that has previously silently dropped a package from one extra's
  # install set entirely (see that floor's comment); the unconditional one
  # alone already covers this extra's need.
  # mamba-ssm/causal-conv1d dropped (bare-metal) — see fsdp extra's comment above.
  # nv-grouped-gemm/deep_ep dropped (bare-metal): MoE-only expert-parallel kernels
  # (DomynEdge is dense), and deep_ep's internode kernels hard-require Hopper
  # TMA/cp.async.bulk PTX instructions (sm_90+) — they don't even compile for
  # Leonardo's A100s (sm_80), regardless of toolchain fixes.
  "transformer-engine[pytorch]==2.17.0.dev0+2a30d03c",                                                               # bare-metal: pinned to match our own wheelyard build
]
vllm = [
  "cuda-python",
  # deep_gemm/deep_ep dropped (bare-metal): both hard-require Hopper (sm_90+ for
  # deep_gemm's FP8 kernels; sm_90+ TMA instructions for deep_ep) — Leonardo only
  # has A100s (sm_80), so neither can build here regardless of toolchain fixes.
  "vllm==0.1.dev18553+g025597207.cu126",
  "num2words>=0.5.14",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set) hard-pins flashinfer-python==0.6.17. flashinfer-cubin
  # (a separate release train) hasn't published a matching 0.6.17 build as of this
  # writing (0.6.13 is the latest on PyPI) — genuine upstream release lag, not
  # something wheelyard or an override can fix. Runtime bypasses the resulting
  # self-consistency check via FLASHINFER_DISABLE_VERSION_CHECK=1 (see launcher).
  "flashinfer-python==0.6.17",
  "flashinfer-cubin==0.6.13",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set) declares nvidia-cutlass-dsl==4.5.2 exactly, but our
  # own loose >=4.4.0.dev1 floor let it resolve to 4.7.1 (newest available)
  # instead — same override-supersedes-the-real-need pattern as llguidance/
  # xgrammar above, caught via the same systematic metadata diff, not a crash.
  "nvidia-cutlass-dsl==4.5.2",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set)'s responses-API code imports `NamespaceTool` from
  # openai.types.responses, missing from openai 2.6.1 (vllm's own metadata only
  # declares openai>=2.0.0, too loose for what its actual code needs). An
  # extra-scoped override-dependencies entry alone didn't work — openai is only
  # ever pulled in transitively (via vllm), and uv dropped it from the lockfile
  # entirely rather than just overriding its version. Direct dep instead, same
  # fix as torchaudio/sglang-kernel above: transitive-only packages need to be
  # made explicit for our own pins/sources to reliably apply.
  # Pinned to 2.25.0 specifically (bisected via `uv pip install` in a scratch venv,
  # not published release notes) as the MINIMAL version with NamespaceTool — not
  # the latest — to stay as close as possible to what nemo_gym's own openai<=2.7.2
  # (see 3rdparty/Gym-workspace/Gym/pyproject.toml, which upper-bounds it "for
  # schema compatibility") was actually tested against, since that ceiling had to
  # be raised too for the universal lock to resolve at all.
  "openai==2.25.0",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set) requires xgrammar>=0.2.1,<1.0.0 (structured-output
  # support; the ModuleNotFoundError was for xgrammar.openai_tool_call_schema,
  # added well after our old 0.1.33 CVE-fix pin). Direct dep for the same reason
  # as openai/torchaudio above — only ever pulled in transitively otherwise.
  # 0.2.3, not the newer 0.2.5: 0.2.5 has no cp313 wheel on PyPI (cp310 only) and
  # would need a from-source build; 0.2.3 is the highest version that ships one
  # and still satisfies vllm's >=0.2.1 floor. Its compiled extension also needs
  # a newer libstdc++ than RHEL8's base gcc ships — see custom/ray_bare_metal.sub.
  "xgrammar==0.2.3",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set) requires llguidance>=1.7.0,<1.8.0 (was 1.3.x for
  # vllm 0.17.1). See override-dependencies comment above for how this was found.
  "llguidance==1.7.6",
]
sglang = [
  "sglang",
  "sglang-kernel", # Must be a direct dep so [tool.uv.sources] VCS override applies (transitive deps don't use sources)
]
# bare-metal: dropped the xgrammar==0.1.33 CVE-fix override for sglang
# (GHSA-7rgv-gqhr-fxg3) — sglang isn't used bare-metal (mutually exclusive with
# vllm/automodel here anyway, see `conflicts` below). Trying to force it
# alongside vllm's own xgrammar==0.2.3 caused two separate problems:
# (1) sglang==0.5.10 itself hard-pins xgrammar==0.1.32, directly conflicting
#     with our 0.1.33 override once both were plain per-extra direct deps.
# (2) Before that: overriding it while vllm also directly depended on a
#     DIFFERENT xgrammar version silently dropped xgrammar from
#     [package.optional-dependencies].vllm entirely — present in
#     [package.metadata].requires-dist, absent from the section that actually
#     drives `uv sync`'s install set (symptom: vllm's engine init crashing with
#     ModuleNotFoundError on xgrammar.openai_tool_call_schema).
# Revisit if sglang is ever actually used bare-metal.
mcore = [
  # also need cudnn (https://developer.nvidia.com/cudnn-downloads?target_os=Linux&target_arch=x86_64&Distribution=Ubuntu&target_version=20.04&target_type=deb_network)
  # wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
  # sudo dpkg -i cuda-keyring_1.1-1_all.deb
  # sudo apt-get update
  # sudo apt-get install cudnn-cuda-12

  # This dependency also needs to be compatible with the spec in Megatron-Bridge/pyproject.toml.
  # It is specified here since we don't directly use Megatron-Bridge/pyproject.toml, but a proxy setup.py+pyproject.toml combo
  # outside to allow "optionally" installing the megatron path. It's simpler to deal with transformer-engine here in the NeMo RL pyproject.toml
  # NOTE (bare-metal): kept on the git build (not wheelyard) because this extra specifically needs
  # the `core_cu12` build (Megatron's C++/CUDA TE bindings), which our wheelyard TE wheel wasn't
  # built with (it only targets the `[pytorch]` extra, per the `automodel`/`fsdp` use case). Verify
  # this still builds cleanly bare-metal before relying on the mcore path.
  "transformer-engine[pytorch,core_cu12]",
  "megatron-core",
  "megatron-bridge",
  # Flash-attn version should be selected to satisfy both TE + vLLM requirements (xformers in particular)
  # https://github.com/NVIDIA/TransformerEngine/blob/v2.3/transformer_engine/pytorch/attention/dot_product_attention/utils.py#L108
  # https://github.com/facebookresearch/xformers/blob/8354497deb2c04c67fbb2e2ad911e86530da0e90/xformers/ops/fmha/flash.py#L76
  "flash-attn==2.8.3",
  "emerging-optimizers==0.2.0",
  "deep_ep @ git+https://github.com/deepseek-ai/DeepEP.git@bfded34800dfec415b71503f8205181de90b2480",
]
nvrx = [
  "nvidia-resiliency-ext",
] # for ft_launcher (fault-tolerant training launcher)
nemo_gym = ["nemo_gym"]

[dependency-groups]

# This is a default group so that we install these even with bare `uv sync`
build = [
  # Build requirement for TE
  "torch==2.10.0",
  # Build requirement for TE
  "setuptools",
  "packaging",
  "einops",
  # Build requirement for nemo_run
  "hatchling",
  # Build requirement for mcore
  "pybind11",
  # Build requirement for flash-attn
  "psutil",
  # cmake/setuptools-scm/wheel/grpcio-tools removed: were vllm's own build-system
  # requires, needed while building it from source. Now a prebuilt wheelyard wheel.
]
docs = [
  "sphinx",
  "sphinx-autobuild",          # For live doc serving while editing docs
  "sphinx-autodoc2",           # For documenting Python API
  "sphinx-copybutton",         # Adds a copy button for code blocks
  "sphinx-design",             # For design components in docs
  "myst_parser",               # For our markdown docs
  "nvidia-sphinx-theme",       # Our NVIDIA theme
  "gitpython>=3.1.45",         # To git-related information
  "python-dotenv",             # For environment variable management
  "sphinxcontrib-mermaid",     # For Mermaid diagram support
  "swagger-plugin-for-sphinx", # For Swagger/OpenAPI documentation
]
dev = [
  "pre-commit>=4.2.0",
  "ruff==0.9.9",
  "types-PyYAML",
  "types-requests",
  "pyrefly==0.24.2",
]
test = [
  "pytest>=8.4.2",
  "pytest-timeout",
  "pytest-cov",
  "pytest-asyncio",
  "pytest-testmon",
]

[tool.uv.sources]
megatron-core = { workspace = true }
nemo-automodel = { path = "3rdparty/Automodel-workspace/Automodel", editable = true }
megatron-bridge = { path = "3rdparty/Megatron-Bridge-workspace", editable = true }
nemo_gym = { workspace = true }
nemo_run = { git = "https://github.com/NVIDIA-NeMo/Run", rev = "414f0077c648fde2c71bb1186e97ccbf96d6844c" }
# bare-metal: torch/torchvision/triton/flash-attn come from our own wheelyard build (pre-built for
# this cluster's RHEL8/glibc + CUDA 12.6, see the [[tool.uv.index]] "wheelyard" entry below) instead
# of the official PyTorch/PyPI CUDA wheels. torchaudio has no wheelyard build yet, so it stays on the
# torch index (and is left unpinned — see the note near override-dependencies).
torch = [
  { index = "wheelyard", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "wheelyard", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
# bare-metal: CPU-only build. torchaudio's own PyPI/pytorch-cuXXX wheels bundle a
# compiled extension linked against whatever CUDA runtime matches THAT wheel's own
# build (e.g. libcudart.so.13) — pytorch-cu129 doesn't have one for our exotic
# wheelyard torch dev build, and PyPI's default silently resolved to a newer
# CUDA-13-linked build, which then failed to load at runtime ("libcudart.so.13:
# cannot open shared object file") since our actual stack is CUDA 12.6. We don't
# use any audio functionality (transformers imports it transitively via
# AutoProcessor, unconditionally, even though it's unused here) — CPU-only avoids
# the whole CUDA-runtime-matching problem.
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
triton = [
  { index = "wheelyard", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
flash-attn = { index = "wheelyard" }
# bare-metal: prebuilt vllm wheel from wheelyard's 13052026 set (built by fbertolo for NeMo-RL
# specifically), so we skip the from-source CUDA-kernel compile entirely (see no-build-isolation-package
# and extra-build-dependencies below — no longer needed now that vllm isn't built here).
vllm = { index = "wheelyard" }
# automodel gets our wheelyard TE wheel; mcore keeps the git build since it needs the core_cu12 extra
# (Megatron's C++/CUDA TE bindings) that our wheelyard wheel wasn't built with.
transformer-engine = [
  { index = "wheelyard", extra = "automodel" },
  { git = "https://github.com/NVIDIA/TransformerEngine.git", rev = "71bbefbf153418f943640df0f7373625dc93fa46", extra = "mcore" },
]
causal-conv1d = { git = "https://github.com/Dao-AILab/causal-conv1d", rev = "67e0a9dfe1518fc0036444e9ab5fe06ab78299e0" }
mamba-ssm = { git = "https://github.com/state-spaces/mamba.git", rev = "d68d16ed7d5d5164eb5a57c0285f3b7eb8394ec1" }
nv-grouped-gemm = { git = "https://github.com/fanshiqing/grouped_gemm", tag = "v1.1.4.post7" }
emerging-optimizers = { git = "https://github.com/NVIDIA-NeMo/Emerging-Optimizers.git", rev = "v0.2.0" }
# Official sglang v0.5.10 with transformers v5 support
sglang = { git = "https://github.com/sgl-project/sglang.git", tag = "v0.5.10", subdirectory = "python" }
sglang-kernel = { git = "https://github.com/sgl-project/sglang.git", tag = "v0.5.10", subdirectory = "sgl-kernel" }

[tool.uv.workspace]
members = [
  "3rdparty/Megatron-LM-workspace",
  "3rdparty/Gym-workspace/Gym",
  # Research projects are also added here in order for them to share the global root level uv.lock.
  # If we don't do this, the research projects do not see the global uv.lock, and may mistakenly
  # install numpy>=2.0 because nemo-rl's core [dependencies] do not pin numpy, but when you inspect
  # nemo-rl's uv.lock you'll see it's 1.X b/c megatron mandates 1.X in the optional dependencies, so
  # globally we must choose 1.X otherwise we run into pickle issues from ray.
  "research/template_project",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# bare-metal: our own pre-built wheels (torch/torchvision/triton/flash-attn/transformer-engine),
# built for this cluster's RHEL8 (glibc 2.28) + CUDA 12.6, avoiding the need for a container.
[[tool.uv.index]]
name = "wheelyard"
url = "file:///leonardo_scratch/fast/AIFAC_L13_018/fbertolo/wheelyard/sets/13052026/simple"
explicit = true

[tool.uv]
preview = true # Enable preview features like extra-build-dependencies
# bare-metal: our wheelyard torch/torchvision/triton/flash-attn/transformer-engine builds are
# Linux-only, so a universal lockfile (which still tries to solve for e.g. darwin) fails outright.
# Same restriction edgerunner's pyproject.toml uses for the same reason.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
extra-build-variables = { sglang-kernel = { CMAKE_BUILD_PARALLEL_LEVEL = "24", FLASHINFER_CUDA_ARCH_LIST = "9.0a 10.0a", CMAKE_ARGS = "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" } }
no-build-isolation-package = [
  # transformer-engine/-torch stay here only for the mcore extra's git build (see
  # [tool.uv.sources].transformer-engine); automodel's copy is a prebuilt wheelyard wheel now.
  "transformer-engine-torch",
  "transformer-engine",
  # flash-attn removed: now a prebuilt wheelyard wheel, no longer built from source.
  "mamba-ssm",
  "causal-conv1d",
  "sglang-kernel",
  # vllm removed: now a prebuilt wheelyard wheel (13052026 set), no longer built from source.
]
# Always apply the build group since dependencies like TE/mcore/nemo-run require build dependencies
# and this lets us assume they are implicitly installed with a simply `uv sync`. Ideally, we'd
# avoid including these in the default dependency set, but for now it's required.
default-groups = ["dev", "build"]
# Users may use different link-modes depending on their scenario:
#  --link-mode=hardlink (default on linux; may get warnings about switching to --link-mode copy if uv cache and venv on different file-systems)
#  --link-mode=copy (slower but more reliable; supresses warning)
#  --link-mode=symlink (fastest option when uv cache and venv on different file-system; caveat: venv is brittle since it depends on the environment/container)
link-mode = "copy"
# The opencv-python-headless override is needed because automodel pins it to 4.10.0.84, whereas vllm>=0.11.0 needs >= 4.11.0
# The timm override is needed because current automodel pins to 1.0.16. This can be removed once we move ToT automodel
# The nvidia-modelopt override is needed because mcore is still on 0.33
# NOTE (bare-metal): dropped the blanket TE override that used to pin one git-built TE version across
# every extra — automodel and mcore now intentionally use different TE sources (see
# [tool.uv.sources].transformer-engine): automodel gets our wheelyard wheel, mcore keeps the git build
# (needs the core_cu12 extra that wheelyard's wheel doesn't have).
# NOTE (bare-metal): dropped the torchaudio==2.10.0 pin — it no longer matches our bumped torch version
# and PyTorch's nightly index doesn't retain a build from the same date as our wheelyard torch wheel
# (nightlies rotate out). Left unpinned; verify at lock time that whatever resolves is ABI-compatible.
# This mainly matters for the sglang extra, whose pinned dependency-metadata (torch==2.9.1 etc.) is
# also stale relative to our torch bump and will likely need reconciling before sglang is actually used.
override-dependencies = [
  "nvidia-cudnn-cu12==9.19.0.56",
  "opencv-python-headless>=4.11.0",
  "timm<=1.0.22",
  "nvidia-modelopt[torch]>=0.39.0",
  "torch==2.13.0.dev20260513+cu126",
  # vllm's own metadata pins its own torch/torchvision versions; override to our wheelyard versions.
  "torchvision==0.27.0.dev20260513+cu126.pinfix",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set) pins
  # pynvvideocodec==2.1.0 exactly, which has no cp313 wheel at all (2.0.x is the
  # newest release line with one). We don't use vLLM's video-decoding path for
  # text-only GRPO training, so relaxing this to the newest cp313-compatible
  # release is safe; revisit if video/multimodal input is ever exercised here.
  "pynvvideocodec==2.0.2",
  # nemo-automodel[moe] pins transformer-engine[pytorch]<=2.11.0 itself; override for the automodel
  # extra specifically (mcore needs a different TE build/version, see [tool.uv.sources]).
  "transformer-engine[pytorch]==2.17.0.dev0+2a30d03c; extra == 'automodel'",
  # bare-metal: was pinned to match vllm 0.17.1's own need (>=1.3.0,<1.4.0); vllm
  # 0.27.2rc1 now requires llguidance>=1.7.0,<1.8.0 instead. Found via a systematic
  # diff of vllm's full Requires-Dist metadata against our pins after repeatedly
  # hitting these one crash at a time (flashinfer/transformers/openai/xgrammar) —
  # this one hadn't crashed yet but was silently just as stale. Moved to the vllm
  # extra's own direct deps (see below) since llguidance is only ever pulled in
  # transitively otherwise, same as openai/torchaudio/xgrammar.
  # Override setuptools range in other dependencies to address CVE GHSA-58pv-8j8x-9vj2
  "setuptools>=80.10.2",
  "deep_ep @ git+https://github.com/deepseek-ai/DeepEP.git@bfded34800dfec415b71503f8205181de90b2480",
  # bare-metal: flashinfer versions are pinned per-extra (vllm uses 0.6.17/0.6.13,
  # sglang uses 0.6.7.post2) since vllm and sglang extras are mutually exclusive
  # and have different requirements. A loose ">=0.5.0" override here previously let
  # flashinfer-python and flashinfer-cubin resolve to DIFFERENT versions (0.6.17 vs
  # 0.6.13) since it doesn't actually enforce either extra's real requirement — that
  # caused a runtime RuntimeError from flashinfer's own self-consistency check.
  # Extra-scoped exact pins close that gap.
  "flashinfer-python==0.6.17; extra == 'vllm'",
  "flashinfer-cubin==0.6.13; extra == 'vllm'",
  "flashinfer-python==0.6.7.post2; extra == 'sglang'",
  "flashinfer-cubin==0.6.7.post2; extra == 'sglang'",
  # openai pin moved to the vllm extra's own direct deps above (see its comment) —
  # overriding it here alone didn't work since it's only ever pulled in transitively.
  # nvidia-cutlass-dsl override removed: it was unconditionally replacing vllm's
  # own exact ==4.6.2 need (now a direct dep in the vllm extra above) with a loose
  # floor that let it drift to whatever's newest on PyPI (4.7.1) instead. sglang's
  # own >=4.4.1 need (via flashinfer 0.6.7.post2) is satisfied without an override.
  # Relax megatron-core workspace member's opentelemetry-api ceiling (<1.34) for protobuf 6.x compat with ray
  "opentelemetry-api>=1.33.1",
  # bare-metal: vllm 0.1.dev18553+g025597207 (wheelyard 13052026 set) hard-requires transformers>=5.5.3 (vllm 0.17.1's own
  # transformers pin moved to an unconditional direct dependency above — an
  # extra=='vllm'-scoped override here, alongside automodel's own >=5.3.0 floor,
  # hit the same silent-drop uv quirk as xgrammar (see its comment above): it
  # dropped transformers from automodel's install set entirely. If megatron-
  # bridge's <=5.3.0 stub below ever actually conflicts with 5.16.0 for the
  # mcore extra, that needs solving there directly, not via a scoped override
  # here — that's exactly the pattern that broke twice already.
  # xgrammar pins (CVE GHSA-7rgv-gqhr-fxg3 fix for sglang; vllm's own >=0.2.1 need)
  # moved to each extra's own direct deps — see their comments for why an
  # override here didn't serialize correctly for vllm.
  # Override dependencies to address CVEs
  "mlflow>=3.11.1",
  # Override outlines for Python 3.13 support
  "outlines>=0.2.0",
  # Upgrade pytest to 9.0.3
  "pytest>=9.0.3",
]
# CVE fixes
constraint-dependencies = [
  "brotli>=1.2.0",            # Address CVE GHSA-2qfp-q593-8484
  "starlette>=0.49.1",        # Address CVE GHSA-7f5h-v6xp-fcq8
  "urllib3>=2.6.3",           # Address CVE GHSA-38jv-5279-wg99
  "aiohttp>=3.13.3",          # Address CVE GHSA-mqqc-3gqh-h2x8
  "pyasn1>=0.6.3",            # Address CVE GHSA-jr27-m4p2-rc6r
  "wheel>=0.46.2",            # Address CVE GHSA-8rrh-rw8j-w5fx
  "protobuf>=6.33.5",         # Address CVE GHSA-7gcm-g887-7qv7
  "python-multipart>=0.0.22", # Address CVE GHSA-wp53-j4wj-2cfg
  "pygments>=2.20.0",         # Address CVE GHSA-5239-wwwm-4pmq
  "cbor2>=5.9.0",             # Address CVE GHSA-3c37-wwvx-h642
  "onnx>=1.21.0rc4",          # Address CVE GHSA-hqmj-h5c6-369m
  "cryptography>=46.0.6",     # Address CVE GHSA-6w46-j5rx-g56g
  "orjson>=3.11.6",           # Address CVE GHSA-hx9q-6w63-j58v
  "pyjwt>=2.12.0",            # Address CVE GHSA-752w-5fwx-jx9f
]

