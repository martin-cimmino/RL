# Augment build dependencies for packages that need torch at build time
# bare-metal: trimmed vs. upstream to just deep_ep/deep_gemm/transformer-engine/
# transformer-engine-torch -- those are the ones the (untouched, unused-by-us) mcore extra still
# references directly, and a real `uv sync --extra automodel` run showed this section is NOT
# actually scoped to only-the-extras-you-sync: uv resolves every extra's full dependency graph
# to compute the universal lockfile (needed for the conflict-forking the `conflicts` list below
# sets up), even for extras you never install. Dropping these entries broke resolution with a
# `ModuleNotFoundError: No module named 'torch'` building deep_ep, even though deep_ep isn't in
# any extra we actually sync. flash-attn/mamba-ssm/causal-conv1d/nv-grouped-gemm are genuinely
# safe to omit -- they're wheel-routed via unscoped [tool.uv.sources] entries above, so even
# mcore's own references to them resolve to our wheels with no build at all.
[tool.uv.extra-build-dependencies]
deep_ep = [{ requirement = "torch", match-runtime = true }]
deep_gemm = [{ requirement = "torch", match-runtime = true }]
transformer-engine = [{ requirement = "torch", match-runtime = true }]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }]

# Needed when building from source (mcore extra only -- see [tool.uv.extra-build-dependencies]
# comment above for why these are still needed despite mcore being unused on this cluster).
[[tool.uv.dependency-metadata]]
name = "deep_ep"
# This version has to match the version in the commit/rev/tag used
version = "v1.2.1+29d31c0"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "deep_gemm"
# This version has to match the version in the commit/rev/tag used
version = "2.5.0"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "transformer-engine"
version = "2.15.0+42b8400"
requires-dist = ["torch", "pydantic", "importlib-metadata>=1.0", "packaging"]

[[tool.uv.dependency-metadata]]
name = "transformer-engine-torch"
version = "2.15.0+42b8400"
requires-dist = ["torch", "transformer-engine"]

[[tool.uv.dependency-metadata]]
name = "megatron-bridge"
# Static metadata so the root resolver handles megatron-bridge's deps
# (avoids workspace-member name-shadowing for megatron-core).
# Must stay in sync with 3rdparty/Megatron-Bridge-workspace/setup.py::CACHED_DEPENDENCIES.
version = "0.0.0"
requires-dist = [
  "transformers>=5.8.1,<5.9.0",
  "mistral-common>=1.10.0",
  "peft>=0.18.1",
  "datasets>=2.20.0",
  "accelerate",
  "diffusers>=0.36.0",
  "peft>=0.18.0",
  "einops",
  "omegaconf>=2.3.0",
  "tensorboard>=2.19.0",
  "typing-extensions",
  "rich",
  "wandb>=0.25.0",
  "six>=1.17.0",
  "regex>=2024.11.6",
  "pyyaml>=6.0.2",
  "tqdm>=4.67.1",
  "hydra-core>1.3,<=1.3.2",
  "qwen-vl-utils",
  # bare-metal: same real cp313-unavailable-for-any-version gap as the nvrx extra's own
  # nvidia-resiliency-ext pin above (confirmed there: cp310/311/312 for 0.6.0, cp312/314 -- no
  # cp313 -- for the latest 0.7.0). Same marker fix for the same reason.
  "nvidia-resiliency-ext; python_version != '3.13'",
  "flash-linear-attention",
  "timm",
  "open-clip-torch>=3.2.0",
  "mlflow>=3.9.0",
  "comet-ml>=3.50.0",
  "torch>=2.6.0",
  "flashinfer-python==0.6.8.post1",
  "flashinfer-cubin==0.6.8.post1",
]

# Override logsage metadata to:
# 1. Remove numpy<=2.0.2 and pandas<=2.3.3 upper bounds
#    (numpy cap conflicts with onnx>=1.21.0rc4 CVE fix via nvidia-resiliency-ext)
# 2. Bump langchain ecosystem to 1.x to address CVE GHSA-qh6h-p6c9-ff54
#    (langchain-core path traversal in legacy load_prompt, fix requires >=1.2.22)
